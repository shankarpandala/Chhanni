[package]
name = "chhanni"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "On-device inbox cleanup."

[lib]
name = "chhanni_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
oauth2 = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "stream"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
time = { version = "0.3", features = ["serde", "serde-human-readable"] }
parking_lot = "0.12"
rusqlite = { version = "0.32", features = ["bundled", "serde_json", "time"] }
refinery = { version = "0.8", features = ["rusqlite"] }
futures = "0.3"
async-trait = "0.1"
directories = "5"
sha2 = "0.10"
hex = "0.4"
bytes = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
once_cell = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt", "rt-multi-thread"] }
wiremock = "0.6"
tempfile = "3"

[lints]
workspace = true
